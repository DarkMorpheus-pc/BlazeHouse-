name: Build and Release BlazeHouse

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'Blaze-House-*'

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Rust
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Frontend lint and production build
        working-directory: modern-ui
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Run Rust unit tests
        working-directory: modern-ui/src-tauri
        run: cargo test

      - name: Build bundles on release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x packaging/build-packages.sh
          ./packaging/build-packages.sh both

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Notlar:
# - Bu workflow Blaze-House reposunda .github/workflows/ altına konur.
# - APP_VERSION (build-packages.sh) ile tag birbirini tutmalı (v2.14 -> 2.14).
# - Release yayınlanınca Blaze House'un kendi güncelleme kontrolü (Hakkında
#   sekmesi) yeni sürümü otomatik algılar.
# - .rpm için native (x86_64) mimari; ARM gerekirse matrix eklenebilir.
