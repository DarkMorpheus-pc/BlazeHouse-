[package]
name = "blazehouse"
version = "5.0.0"
description = "Blaze House - Linux Control Center"
authors = ["BlazeOS Team"]
edition = "2021"

[lib]
name = "blazehouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blaze-house"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["custom-protocol"] }
tauri-plugin-log = "2"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
