<!doctype html>
<html lang="tr" style="background-color: #0b0c0e; color: #f4f4f5; margin: 0; padding: 0; overflow: hidden; height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blaze House - Linux Settings</title>
    <meta name="description" content="Material 3 concept settings and system control center for BlazeOS (Debian & Fedora editions) with dynamic color, fluid animations, and deep hardware optimization." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Flex:opsz,wght@8..144,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #0b0c0e;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      @keyframes blaze-flame-pulse {
        0% { transform: scale(0.92); opacity: 0.5; filter: drop-shadow(0 0 8px rgba(255, 102, 0, 0.4)); }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 24px rgba(255, 102, 0, 0.85)); }
        100% { transform: scale(0.92); opacity: 0.5; filter: drop-shadow(0 0 8px rgba(255, 102, 0, 0.4)); }
      }
      @keyframes blaze-text-glow {
        0% { opacity: 0.7; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-[#0b0c0e] text-zinc-100 antialiased selection:bg-amber-500/30 selection:text-amber-200" style="background-color: #0b0c0e;">
    <div id="root">
      <div id="blaze-startup-splash" style="position: fixed; inset: 0; background: #0b0c0e; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none;">
        <div style="position: relative; width: 80px; height: 80px; margin-bottom: 22px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -10px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 102, 0, 0.25) 0%, transparent 70%);"></div>
          <svg style="animation: blaze-flame-pulse 1.8s ease-in-out infinite;" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#ff6600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
        </div>
        <div style="font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; margin-bottom: 6px;">Blaze House</div>
        <div style="font-size: 13px; font-weight: 500; color: #ff944d; letter-spacing: 0.02em; animation: blaze-text-glow 1.2s ease-in-out infinite alternate;">Sisteminiz Blaze evreninde inceleniyor...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
